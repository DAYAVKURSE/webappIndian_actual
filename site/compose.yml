services:
  web:
    container_name: reactSite
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
    command: nginx -g "daemon off;"
    networks:
      - db-network          # < существующая внутренняя
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
networks:
  backend:
  db-network:            # внешний бридж, уже создан на хосте
    external: true